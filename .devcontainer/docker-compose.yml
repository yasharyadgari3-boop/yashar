# The site's container and a PostgreSQL 16 database. The site shares the database's network,
# so the database is at localhost:5432, as in .env.example.
services:
  app:
    # The exact Node.js version the project is built and tested with (some packages need >= 22.22).
    image: node:22.23.4-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: beautymed
      POSTGRES_PASSWORD: beautymed_dev
      POSTGRES_DB: beautymed_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
